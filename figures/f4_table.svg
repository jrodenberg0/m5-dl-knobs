    <text style="fill: #8a8a8a; font: 6.5px 'Helvetica Neue', 'Arial', 'DejaVu Sans'" transform="translate(74.412 234.45026)">LGBM: factory weekly recipe, direct (one model per lead), lags 1–26, rolling 4/13/26/52, calendar features, stock mlforecast transforms.</text>
   </g>
