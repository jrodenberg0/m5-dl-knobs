   <g id="text_23">
    <text style="fill: #8a8a8a; font: 6.5px 'Helvetica Neue', 'Arial', 'DejaVu Sans'" transform="translate(74.412 219.875432)">M5 weekly, 30,490 item-store series, rolling origin (3 folds × 13 weeks, refit each fold; the partial final week is not scored), single seed,</text>
